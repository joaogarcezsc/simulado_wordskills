<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="card">
        <div class="titulo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM1 2v2h2l3.6 7.6-1.4 2.4C5.1 14.3 5 14.6 5 15a2 2 0 0 0 2 2h12v-2H7.4a.25.25 0 0 1-.25-.25l.03-.12L8.1 13h7.45a2 2 0 0 0 1.75-1.03l3.58-6.49A1 1 0 0 0 20 4H5.2l-.94-2H1z" />
            </svg>
            <strong>Price</strong> <span>Range</span>
        </div>
        <div class="slider">
            <div class="trilho"></div>
            <div class="selecionado" id="selecionado"></div>
            <input type="range" id="minimo" min="0" max="1000" step="50" value="400">
            <input type="range" id="maximo" min="0" max="1000" step="50" value="600">
        </div>

        <div class="valores">
            <span id="textoMinimo">$ 400</span>
            <span id="textoMaximo">$ 600</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
